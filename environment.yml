# Dedicated env for immerdink:
#   mamba env create -f environment.yml
name: immerdink
channels: [conda-forge]
dependencies:
  - python=3.14
  - numpy
  - pytest
  - cmake
  - ninja
  - cxx-compiler
  - cuda-version=13.4
  - cuda-nvcc
  - cuda-cudart-dev
  - openjdk=25           # TLC without depending on the VS Code extension
  - nsight-compute       # ncu kernel profiling (needs GPU counters: see docs/BENCHMARKING.md)
