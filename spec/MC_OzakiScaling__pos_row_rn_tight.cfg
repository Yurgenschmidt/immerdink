\* RN ON its norm budget: K = 4 (kappa = 2, a perfect square), T = 4 (P = 40),
\* F = 4 >= 2(Prec-1), so S is exact (no ceiling slack, as at real F = 60).
\* All 14950 rows of length 4 over Prec 3, EMin -1, EMax 0. The row
\* (1.5, 1.5, 1.5, 1.5) * 2^g has ||a 2^sigma|| = 3 = T - kappa/2 exactly and
\* rounds (ties to even) to (2, 2, 2, 2): ||a'||^2 = 16 = T^2. Witnessed by
\* neg_witness_rn_norm_at_T and neg_witness_kappa_slack.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 0
    F = 4
    Moduli <- Mod85
    K = 4
    NZ = 4
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
