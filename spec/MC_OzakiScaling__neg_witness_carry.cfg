\* EXPECT: Invariant NoCarry is violated
\* Witness (non-vacuity): pos_joint_rn_round reaches a carry-out (the rounded
\* significand is 2^Prec and renormalizes to the next binade).
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 0
    F = 2
    Moduli <- Mod4357
    K = 2
    NZ = 2
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS NoCarry
