\* RN; P = 420 (H = 209, T = 14): z has up to 8 bits, so the single final
\* rounding to Prec = 3 bits is exercised hard (ties, carry-out, subnormal
\* results, underflow to +-0, overflow to +-Inf).
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 0
    F = 2
    Moduli <- Mod4357
    K = 2
    NZ = 2
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat ShiftFits SigmaBound
           SigmaInRange CRTPrecondition CRTRoundTrip ErrorBound FinalRounding
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc ContractL2
