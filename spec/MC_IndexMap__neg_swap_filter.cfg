\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Swap decided over ALL of C's modes: an extent-1 I mode of stride 0 swaps
\* swape1 and puts C's real fastest mode (j) on i-bar.
\* EXPECT: Invariant SwapMakesJFastest is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {1, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- SwS
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "SwapFilter"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
INVARIANTS
    SwapMakesJFastest
