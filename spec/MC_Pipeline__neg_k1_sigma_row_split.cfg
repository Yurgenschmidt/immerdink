\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* K1b splits a row over two CTAs, each writing sigma over gamma in place: the second reads sigma as gamma.
\* EXPECT: Invariant NoStaleRead is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = TRUE
    Fused = FALSE
    MParts = 1
    FusedLarge = {}
    Packed = {}
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "sigmaRowSplit"
    EnforcePreconditions = FALSE
INVARIANTS NoStaleRead
