\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Swap after the limit check: user m = 3, n = 2 pass, the GEMM runs with nh = 4.
\* EXPECT: Invariant GemmDimsFit is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {0, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- Dn3
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "SwapLate"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- ExModes
    GemmMax = 3
    AlignWS = 16
INVARIANTS
    GemmDimsFit
