\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* g = 2: groups {1,2},{3} (short last group); MaxZ = 1 splits group 1 into 2 launches.
\* AlignWS = 32 (real 256:16 ratio): align(vec) is not a no-op, so an unaligned vec is caught.
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 2
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 32
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "none"
    EnforcePreconditions = TRUE
INVARIANTS TypeOK NoStaleRead SigmaFinalAtUse PlanBytesExact ReuseAfterRetire PlanesFinalAtCRT FinalAtMostOnce FinalExactlyOnceAtEnd CorrectPath BetaZeroNoCRead AlphaZeroNoABRead NoInputClobber AccessesSafe RegionsUsed RegionsDisjoint RegionsAligned RegionsFit LayoutExact ChunksPartition GemmAligned LaunchGridOK PlanesWrittenOnce PlanesCoverAtEnd LaunchGridYOK DispatchByDescriptor
PROPERTY Termination
