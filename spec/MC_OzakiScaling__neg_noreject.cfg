\* EXPECT: Invariant NormBudget is violated
\* Rejection rule removed and kappa = 2T + 2 (T = 1, K = 10): the squared rule
\* (2T - kappa)^2 admits a shift again but ||a'|| exceeds T. (At kappa =
\* 2T + 1 every a' rounds to 0, so 2T + 2 is the first failing kappa.)
\* NZ = 2 enumerated entries, the other 8 are zero.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusTwo
    EMax = 2
    F = 2
    Moduli <- Mod8
    K = 10
    NZ = 2
    Mode = "RN"
    Mutation = "noReject"
    ShiftBits = 8
INVARIANTS NormBudget
