\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Policy also applied to an empty output (nothing runs).
\* EXPECT: Invariant KappaScope is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {0, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- Dn3
    BasesA <- B0
    BasesB <- B0
