    Drop = "KappaEmpty"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- ExKappa
    GemmMax = 100
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    KappaScope
