\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* RA sized for N moduli instead of g (g = 1, N = 3): over-allocation, not the formula.
\* EXPECT: The invariant of LayoutExact is equal to FALSE
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "raSizedN"
    EnforcePreconditions = FALSE
INVARIANTS LayoutExact
