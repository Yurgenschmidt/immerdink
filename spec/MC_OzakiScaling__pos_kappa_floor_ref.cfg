\* Reference for neg_kappa_floor (Mutation none): non-square K = 2
\* (kappa = ceil(sqrt 2) = 2, floor would be 1), T = 14 (P = 420), Prec 5,
\* EMin -1, EMax 0, F = 8 = 2(Prec-1) (exact S). All 4560 rows of length 2.
\* At the RN boundary of this config the max ||a'||^2 is 180 <= 196 = T^2.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 5
    EMin <- MinusOne
    EMax = 0
    F = 8
    Moduli <- Mod4357
    K = 2
    NZ = 2
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
