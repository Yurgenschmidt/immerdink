\* RN; all 18424 rows (multisets) of length K = 3 over the row format
\* (Prec 3, EMin -2, EMax 2); kappa = 2 < T = 5; F = 2 (ceiling lossy).
\* ShiftBits = 4 is exactly the signed width of sigma's range [-2, 6]
\* (SigmaMin/SigmaMax are attained: see the ASSUME); neg_shiftbits uses 3.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusTwo
    EMax = 2
    F = 2
    Moduli <- Mod87
    K = 3
    NZ = 3
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 4
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
