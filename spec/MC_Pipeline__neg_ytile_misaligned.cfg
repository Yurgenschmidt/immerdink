\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* TileN = 3 is not a multiple of AlignN = 2: the second launch starts at
\* column 3, a misaligned B / W pointer.
\* EXPECT: The invariant of GemmAligned is equal to FALSE
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 1
    n = 5
    k = 3
    N = 2
    g = 2
    ChunkLen = 2
    MaxZ = 2
    TileN = 3
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "none"
    EnforcePreconditions = FALSE
INVARIANTS GemmAligned
