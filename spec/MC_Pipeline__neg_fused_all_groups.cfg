\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* One KF launch packs every group (g = 1) into the same slot: group 1's
\* GEMMs read modulus 3's residues.
\* EXPECT: Invariant NoStaleRead is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    Fused = TRUE
    MParts = 1
    FusedLarge = {}
    Packed = {}
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "fusedAllGroups"
    EnforcePreconditions = FALSE
INVARIANTS NoStaleRead
