\* ON the design's RN rejection boundary: kappa = T - 1 (T = 3, K = 4 is
\* the largest K with kappa = 2; K = 5 gives kappa = 3 = T, rejected).
\* All 230300 rows of length 4. NOTE: kappa = T is NOT a correctness
\* boundary (see pos_kappa_2Tm1); there is no failing model at kappa = T.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusTwo
    EMax = 2
    F = 2
    Moduli <- Mod45
    K = 4
    NZ = 4
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
