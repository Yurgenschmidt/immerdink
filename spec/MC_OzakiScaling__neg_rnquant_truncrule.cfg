\* EXPECT: Invariant NormBudget is violated
\* RN quantization with the TRUNC shift rule S*4^u <= T^2*2^F. (Algebraically
\* the same rule as neg_nokappa; kept to name the design rule it breaks.)
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusTwo
    EMax = 2
    F = 2
    Moduli <- Mod87
    K = 3
    NZ = 3
    Mode = "RN"
    Mutation = "rnQuantTruncRule"
    ShiftBits = 8
INVARIANTS NormBudget
