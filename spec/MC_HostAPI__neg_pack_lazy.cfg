    NT = 2
    SharePlan = FALSE
    ShareWs = FALSE
    SameStream = FALSE
    VecSrc = "generate"
    OpSrc = "planCache"
    GlobalLazy = FALSE
    DestroyWaitsGPU = FALSE
    PackMode = "lazyCache"
    NewHandle = FALSE
    ShareBuf = FALSE
INVARIANTS NoHostRace
