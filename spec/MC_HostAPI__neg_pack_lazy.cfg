\* Model for MC_HostAPI.tla (see that file for the rationale of each model).
\* D1: a lazily filled cache in the handle, written by the first call that finds it empty (own plans: concurrent plan creations).
\* EXPECT: Invariant NoHostRace is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
