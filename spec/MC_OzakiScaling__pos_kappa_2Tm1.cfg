\* Rejection rule REMOVED, kappa = 2T - 1 = 3 (T = 2, K = 9): the shift rule
\* is still sound (||a'|| <= (2T-kappa)/2 + kappa/2 = T). All 92378 rows
\* of length 9 over the tiny format (Prec 2, EMin 0, EMax 1). This is the
\* last kappa for which the rule is sound; neg_kappa_2T is boundary + 1.
\* Also guards UOf's FLOOR division: here d = BitLen(Rhs) - BitLen(4S) < 0 for
\* some rows, and a C-style truncating (d+1)/2 breaks ShiftIsMaximal.
SPECIFICATION RowSpec
CONSTANTS
    Prec = 2
    EMin = 0
    EMax = 1
    F = 2
    Moduli <- Mod43
    K = 9
    NZ = 9
    Mode = "RN"
    Mutation = "noReject"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
