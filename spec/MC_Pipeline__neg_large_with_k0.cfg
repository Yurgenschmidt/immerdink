\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* KL's CTAs run in the same launch as K0's: a KL CTA reads scatter
\* vectors K0 has not written yet (KL, unlike KF, reads the vec region).
\* EXPECT: Invariant NoStaleRead is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 3
    ChunkLen = 2
    MaxZ = 3
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    Fused = FALSE
    MParts = 1
    FusedLarge = {"A", "B"}
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "largeWithK0"
    EnforcePreconditions = FALSE
INVARIANTS NoStaleRead
