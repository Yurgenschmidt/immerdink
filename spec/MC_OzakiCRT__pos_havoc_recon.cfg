\* Model for MC_OzakiCRT.tla (see that file for the rationale of each model).
\* neg_chunk's parameters (havoc reachable, Covers "havoc"): the epilogue and
\* the §3.6 reconstruction stay well-defined on garbage planes.
SPECIFICATION Spec
CONSTANTS
    Moduli <- ModR3
    ResBits = 3
    AccBits = 7
    K = 4
    KC = 4
    ValsA <- VWorst
    ValsB <- VWorst
    ChunkCarry = TRUE
    Drop = "PreChunk"
    InputFilter = "all"
    Covers <- CovHavoc
INVARIANTS TypeOK CRTRecon CRTReconAbs
