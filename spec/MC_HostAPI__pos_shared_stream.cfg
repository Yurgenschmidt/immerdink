\* Model for MC_HostAPI.tla (see that file for the rationale of each model).
\* v1.2: two threads share one plan and one stream (own workspaces); launches interleave.
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    NT = 2
    SharePlan = TRUE
    ShareWs = FALSE
    SameStream = TRUE
    VecSrc = "generate"
    OpSrc = "planCache"
    GlobalLazy = FALSE
    DestroyWaitsGPU = FALSE
    PackMode = "none"
    NewHandle = FALSE
    ShareBuf = FALSE
INVARIANTS TypeOK NoHostRace NoUseAfterFree NoWsHazard ParamsOwn CompleteAtEnd
PROPERTY Termination
