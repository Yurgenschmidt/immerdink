\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* The packed B region sized with n-hat = ceil_Q(n) rows (PadQ = 4: n = 2, n-hat = 4).
\* EXPECT: Invariant WorkspaceExact is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 1
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- Free5
    StridesB <- Free5
    StridesC <- Col
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 4
    CanonicalLabels = TRUE
    Drop = "HwGemmWsPadN"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XHwSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    WorkspaceExact
