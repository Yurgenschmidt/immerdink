\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Limit also applied in DIRECT mode: a valid DIRECT call is rejected.
\* EXPECT: Invariant LimitScope is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {0, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- Dn3
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "GemmLimitDirect"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- ExModes
    GemmMax = 3
    AlignWS = 16
INVARIANTS
    LimitScope
