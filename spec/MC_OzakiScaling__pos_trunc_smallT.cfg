\* TRUNC needs no rejection: T = 1 (P = 8) with K = 4 (kappa = 2 > T)
\* still satisfies NormBudget. All 230300 rows of length 4.
\* Also guards UOf's FLOOR division (d < 0 here; truncating (d+1)/2 fails
\* ShiftIsMaximal).
SPECIFICATION RowSpec
CONSTANTS
    Prec = 3
    EMin <- MinusTwo
    EMax = 2
    F = 2
    Moduli <- Mod8
    K = 4
    NZ = 4
    Mode = "TRUNC"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat
           ResidueFactorization SigmaInRange ShiftFits SigmaBound
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc
