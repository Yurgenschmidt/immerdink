\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* Off by one: y part q covers [q·YLen, (q+1)·YLen] (inclusive end), so
\* column 2 is written by both launches.
\* EXPECT: Invariant PlanesWrittenOnce is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 1
    n = 3
    k = 3
    N = 2
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 2
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    Fused = FALSE
    MParts = 1
    FusedLarge = {}
    Packed = {}
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "ySplitOverlap"
    EnforcePreconditions = FALSE
INVARIANTS PlanesWrittenOnce
