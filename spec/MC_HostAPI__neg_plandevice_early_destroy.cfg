\* Model for MC_HostAPI.tla (see that file for the rationale of each model).
\* plan-owned device vectors (D2D K0) with the v1.2 lifetime rule.
\* EXPECT: Invariant NoUseAfterFree is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    NT = 2
    SharePlan = FALSE
    ShareWs = FALSE
    SameStream = FALSE
    K0Src = "planDevice"
    OpSrc = "planCache"
    GlobalLazy = FALSE
    DestroyWaitsGPU = FALSE
INVARIANTS NoUseAfterFree
