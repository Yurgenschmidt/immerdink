\* Model for MC_HostAPI.tla (see that file for the rationale of each model).
\* D1: one pack handle shared by three threads (imd_pack, plan creation, contract); destroyed once every call returned, GPU work possibly pending.
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    NT = 3
    SharePlan = TRUE
    ShareWs = FALSE
    SameStream = FALSE
    VecSrc = "generate"
    OpSrc = "planCache"
    GlobalLazy = FALSE
    DestroyWaitsGPU = FALSE
    PackMode = "design"
    NewHandle = FALSE
    ShareBuf = FALSE
INVARIANTS TypeOK NoHostRace NoUseAfterFree NoWsHazard ParamsOwn NoPackBufHazard CompleteAtEnd
PROPERTY Termination
