\* Model for MC_OzakiCRT.tla (see that file for the rationale of each model).
\* KC = 5 > KCMax = 3 with only inputs whose chunk sums all fit (mixed-sign
\* products): the K_c rule must bound sum |products|, not |sum|.
\* EXPECT: Invariant CRTExact is violated
SPECIFICATION Spec
CONSTANTS
    Moduli <- ModR3
    ResBits = 3
    AccBits = 7
    K = 5
    KC = 5
    ValsA <- VOrdA
    ValsB <- VOrdB
    ChunkCarry = TRUE
    Drop = "PreChunk"
    InputFilter = "finalSumFits"
    Covers <- CovNone
INVARIANTS CRTExact
