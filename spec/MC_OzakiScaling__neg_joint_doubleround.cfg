\* EXPECT: Invariant FinalRounding is violated
\* [G8]-style unscaling: round to Prec bits, then again onto the subnormal grid.
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 0
    F = 2
    Moduli <- Mod4357
    K = 2
    NZ = 2
    Mode = "RN"
    Mutation = "doubleRound"
    ShiftBits = 8
INVARIANTS FinalRounding
