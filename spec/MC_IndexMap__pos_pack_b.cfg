\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* D1: caller's B packed, PadQ = 4 (n = 2 -> n^ = 4: role B reads rows into the next block and the tail), batches.
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 3
    RankC = 2
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- ColRow
    StridesC <- ColRow
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 4
    CanonicalLabels = TRUE
    Drop = "none"
    CheckOrders = FALSE
    MustCover = {"pk_rb"}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "B"
    PackEnum = "plan"
INVARIANTS
    StatusCorrect Partition EinsumPreserved ScatterExactlyOnce ScatterCoversC
    AccessInBounds ReadsExact ZeroExtentRules PaddingInert LayoutBijective
    DecodeBijective FusionPreservesAddresses OperandIndependence NoCAliasing
    StrideRuleImpliesInjective OrderIndependent CanonicalOrderSorted
    CanonicalOrderExact
    SwapWellDefined SwapMakesJFastest DispatchByDescriptor WorkspaceFits
    WorkspaceExact GemmDimsFit LimitScope KappaAccepted KappaScope NoNullDeref WsNoAlias AliasingSound
    AlignedAccess WsSufficient
    PackKeySound PackComplete DescForReproduces AdoptedOrderExact AutoOrderV15
    PackNoOOB PackPaddingInert KeyRejectsPartnerOnly PackPolicy
