\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* D1: a pack without its zeroed tail: role B reads the last block's rows r..n^-1 past the end.
\* EXPECT: Invariant PackNoOOB is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 3
    RankC = 2
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- ColRow
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 4
    CanonicalLabels = TRUE
    Drop = "PackNoTail"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "B"
    PackEnum = "plan"
INVARIANTS
    PackNoOOB
