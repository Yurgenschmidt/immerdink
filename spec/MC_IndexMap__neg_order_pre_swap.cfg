\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Canonical orders computed before the swap: at m = n the K order follows
\* the caller's A, not the post-swap A (ordK).
\* EXPECT: Invariant CanonicalOrderSorted is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3, 4}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- Ord2
    StridesB <- Ord2
    StridesC <- ColRow
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "OrderPreSwap"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    CanonicalOrderSorted
