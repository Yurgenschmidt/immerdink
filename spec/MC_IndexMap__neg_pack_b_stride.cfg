\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* D1: role B read at v1's batch stride n^*k^ instead of r*k^: other rows (or the tail) are multiplied.
\* EXPECT: Invariant EinsumPreserved is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 3
    RankC = 2
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- ColRow
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 4
    CanonicalLabels = TRUE
    Drop = "PackBStrideNh"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "B"
    PackEnum = "plan"
INVARIANTS
    EinsumPreserved
