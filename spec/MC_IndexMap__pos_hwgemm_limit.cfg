\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Row 5 for HWGEMM, GemmMax = 3, EMULATE / DIRECT / HWGEMM: n = 3 accepted in HWGEMM (no n-hat),
\* k = 3 ON the boundary, k = 4 rejected, DIRECT exempt; EMULATE as in pos_limit_n.
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {0, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- Dn3
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "none"
    CheckOrders = FALSE
    MustCover = {"limm3", "limn3", "limdir", "limswap", "limempty", "limkempty", "limk0", "hwlimn3", "hwlimsw", "hwlimk3", "hwlimk4", "hwlimk4d"}
    Execs <- ExModes3
    GemmMax = 3
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    StatusCorrect Partition EinsumPreserved ScatterExactlyOnce ScatterCoversC
    AccessInBounds ReadsExact ZeroExtentRules PaddingInert LayoutBijective
    DecodeBijective FusionPreservesAddresses OperandIndependence NoCAliasing
    StrideRuleImpliesInjective OrderIndependent CanonicalOrderSorted
    CanonicalOrderExact
    SwapWellDefined SwapMakesJFastest DispatchByDescriptor WorkspaceFits
    WorkspaceExact GemmDimsFit LimitScope NoNullDeref WsNoAlias AliasingSound
    AlignedAccess WsSufficient
    InPlaceExact InPlaceUnitStride HwAffineNoWs
