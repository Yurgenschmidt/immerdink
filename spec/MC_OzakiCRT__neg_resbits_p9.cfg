\* Model for MC_OzakiCRT.tla (see that file for the rationale of each model).
\* PreResidue at boundary+1: p = 9 = 2^ResBits + 1 (SMod(4,9) = 4 > ResHi = 3).
\* EXPECT: Invariant ResiduesFit is violated
SPECIFICATION Spec
CONSTANTS
    Moduli <- ModR3P9
    ResBits = 3
    AccBits = 6
    K = 1
    KC = 1
    ValsA <- V4
    ValsB <- V4
    ChunkCarry = TRUE
    Drop = "PreResidue"
    InputFilter = "all"
    Covers <- CovNone
INVARIANTS ResiduesFit
