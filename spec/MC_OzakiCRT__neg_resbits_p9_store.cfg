\* Model for MC_OzakiCRT.tla (see that file for the rationale of each model).
\* PreResidue at boundary+1, end to end: residue 4 of p = 9 is stored as the
\* 3-bit operand -4, not congruent mod 9 (every chunk fits: KC = 1 = KCMax).
\* EXPECT: Invariant CRTExact is violated
SPECIFICATION Spec
CONSTANTS
    Moduli <- ModR3P9
    ResBits = 3
    AccBits = 6
    K = 1
    KC = 1
    ValsA <- V4
    ValsB <- V1
    ChunkCarry = TRUE
    Drop = "PreResidue"
    InputFilter = "all"
    Covers <- CovNone
INVARIANTS ChunkFits CRTExact
