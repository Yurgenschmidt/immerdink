\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* two streams with events except the WAR edge: pack(G+1) overwrites RA/RB while GEMMs of G run.
\* EXPECT: Invariant ReuseAfterRetire is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = TRUE
    TwoStreams = TRUE
    UseEvents = TRUE
    Bug = "noWAR"
    EnforcePreconditions = FALSE
INVARIANTS ReuseAfterRetire
