\* Pins H = (P-1) div 2 (DESIGN §2): P = 18, H = 8, T = 2. With the slip
\* H = P div 2 = 9 the budget would be T = 3, admitting a' = b' = 3, z = 9,
\* and SMod(9, 18) = -9: CRTRoundTrip/CRTPrecondition fail. (At real widths
\* P/2 = 2^7 * odd is never a square, so the slip would not change T there.)
\* TRUNC, K = 1, all 961 (a, b) over Prec 3, EMin -1, EMax 1, F = 4.
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 1
    F = 4
    Moduli <- Mod29
    K = 1
    NZ = 1
    Mode = "TRUNC"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat ShiftFits SigmaBound
           SigmaInRange CRTPrecondition CRTRoundTrip ErrorBound FinalRounding
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc ContractL2
