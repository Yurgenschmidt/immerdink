    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = TRUE
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "k1Merged"
    EnforcePreconditions = FALSE
INVARIANTS NoStaleRead
