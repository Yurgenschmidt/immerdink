\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* g = 2: RB's (slot, lambda) blocks strided by n rows instead of n-hat: slot 1 overlays
\* slot 0's zero row (aliasing invisible to the separate-buffer view; only LayoutExact sees it).
\* EXPECT: The invariant of LayoutExact is equal to FALSE
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 2
    ChunkLen = 2
    MaxZ = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "rbStrideN"
    EnforcePreconditions = FALSE
INVARIANTS LayoutExact
