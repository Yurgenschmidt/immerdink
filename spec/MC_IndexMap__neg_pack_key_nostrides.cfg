\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* D1: the key without strides: a different tensor's pack (same extents) is accepted, its gather is not the plan's.
\* EXPECT: Invariant PackKeySound is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 0
    ExtentSet = {2}
    PerModeExtents = FALSE
    StridesA <- ColRow
    StridesB <- ColRow
    StridesC <- ColRow
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "KeyNoStrides"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "A"
    PackEnum = "strides"
INVARIANTS
    PackKeySound
