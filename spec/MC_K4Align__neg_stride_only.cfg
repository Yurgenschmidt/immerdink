\* Model for MC_K4Align.tla (see that file for the rationale of each model).
\* stride padded to 64, GEMM K extent ceil(k)_16: the residue tile shifts the main loop.
\* EXPECT: Invariant MainLoopAligned is violated
SPECIFICATION Spec
CONSTANTS
    TileK = 8
    AlignQ = 2
    BaseAlign = 32
    KC = 23
    KMax = 40
    KPadMin = 12
    Shape <- ShapeBase
    Mut = "strideOnly"
INVARIANTS Aligned16 ExtentOK TileStartsAligned MainLoopAligned
