\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Limit on n instead of nh: n = 3 passes, nh = 4 is launched.
\* EXPECT: Invariant GemmDimsFit is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {0, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- Dn3
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "GemmLimitN"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- ExModes
    GemmMax = 3
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    GemmDimsFit
