\* RN; all 140185 (a, b) pair lists with K = 2 over the joint format (Prec 3,
\* EMin -1, EMax 0); P = 20, so T^2 = H = 9: CRTPrecondition is exactly
\* tight (neg_joint_Tplus1 is +1); kappa = 2 < T = 3.
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 0
    F = 2
    Moduli <- Mod45
    K = 2
    NZ = 2
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat ShiftFits SigmaBound
           SigmaInRange CRTPrecondition CRTRoundTrip ErrorBound FinalRounding
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc ContractL2
