\* Model for MC_IndexMap.tla (see that file for the rationale of each model).
\* Swap after sizing: §4a regions sized with the pre-swap m, n overrun.
\* EXPECT: Invariant WorkspaceFits is violated
SPECIFICATION Spec
CONSTANTS
    Labels = {1, 2, 3}
    RankA = 2
    RankB = 2
    RankC = 2
    ExtentSet = {1, 2, 3}
    PerModeExtents = FALSE
    StridesA <- Col
    StridesB <- Col
    StridesC <- SwS
    BasesA <- B0
    BasesB <- B0
    BasesC <- C100
    PadQ = 2
    CanonicalLabels = TRUE
    Drop = "SwapLate"
    CheckOrders = FALSE
    MustCover = {}
    Execs <- XDefSet
    GemmMax = 1000
    AlignWS = 16
    Packing = "none"
    PackEnum = "plan"
INVARIANTS
    WorkspaceFits
