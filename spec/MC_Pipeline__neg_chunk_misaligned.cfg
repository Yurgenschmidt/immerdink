\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* K_c' = 3 is not a multiple of AlignK = 2: chunk 1's operand pointers are misaligned.
\* EXPECT: The invariant of GemmAligned is equal to FALSE
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 3
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    Fused = FALSE
    MParts = 1
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "none"
    EnforcePreconditions = FALSE
INVARIANTS GemmAligned
