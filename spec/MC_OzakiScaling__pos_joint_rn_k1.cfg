\* RN, K = 1 (kappa = 1), P = 10: H = 4 = T^2 with T = 2 even, so RN can
\* reach the CRT bound: a = b = 1.5 * 2^g gives a 2^sigma = 1.5 -> a' = 2 and
\* z = 4 = H (neg_witness_rn_crt_at_H). All 961 (a, b) over Prec 3, EMin -1,
\* EMax 1, F = 4 (exact S).
SPECIFICATION JointSpec
CONSTANTS
    Prec = 3
    EMin <- MinusOne
    EMax = 1
    F = 4
    Moduli <- Mod25
    K = 1
    NZ = 1
    Mode = "RN"
    Mutation = "none"
    ShiftBits = 8
INVARIANTS TypeOK SExact ShiftIsMaximal NormBudget QuantFormat ShiftFits SigmaBound
           SigmaInRange CRTPrecondition CRTRoundTrip ErrorBound FinalRounding
           GammaIsIlogb SBounded QuantIsRNEven QuantIsTrunc ContractL2
