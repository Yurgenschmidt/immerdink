\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* D1: role B reads the pack with v1's RB block stride n^*k^ instead of r*k^ (b = 2, n = 1, n^ = 2): other rows / planes.
\* EXPECT: Invariant NoStaleRead is violated
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 2
    m = 2
    n = 1
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 2
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    VecResident = FALSE
    K1Split = FALSE
    Fused = FALSE
    MParts = 1
    FusedLarge = {}
    Packed = {"B"}
    TwoStreams = FALSE
    UseEvents = FALSE
    Bug = "packedBStrideNh"
    EnforcePreconditions = FALSE
INVARIANTS NoStaleRead
