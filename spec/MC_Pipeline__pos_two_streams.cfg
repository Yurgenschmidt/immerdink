\* Model for MC_Pipeline.tla (see that file for the rationale of each model).
\* packs on a 2nd stream with all three event edges (RAW sigma, RAW RA/RB, WAR reuse).
\* These edges serialize the side stream completely (sufficiency only, no overlap).
\* CHECK_DEADLOCK
SPECIFICATION Spec
CONSTANTS
    b = 1
    m = 2
    n = 3
    k = 3
    N = 3
    g = 1
    ChunkLen = 2
    MaxZ = 1
    TileN = 16
    MaxY = 1
    AlignWS = 8
    AlignK = 2
    AlignN = 2
    WsBytes <- WsExact
    Direct = FALSE
    KEmpty = FALSE
    TwoStreams = TRUE
    UseEvents = TRUE
    Bug = "none"
    EnforcePreconditions = TRUE
INVARIANTS TypeOK NoStaleRead ReuseAfterRetire PlanesFinalAtCRT FinalAtMostOnce FinalExactlyOnceAtEnd CorrectPath BetaZeroNoCRead AlphaZeroNoABRead NoInputClobber AccessesSafe RegionsUsed RegionsDisjoint RegionsAligned RegionsFit LayoutExact ChunksPartition GemmAligned LaunchGridOK PlanesWrittenOnce PlanesCoverAtEnd LaunchGridYOK DispatchByDescriptor
PROPERTY Termination
